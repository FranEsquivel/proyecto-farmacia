version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: farmacia_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: farmacia_db
    ports:
      - "3306:3306"
    volumes:
      - ./database/farmacia_db.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: